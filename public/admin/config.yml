backend:
  name: github
  repo: leftkal/alexandra-website
  branch: main
  base_url: https://decap-github-auth.leftkal.workers.dev
  auth_endpoint: auth

media_folder: public/images
public_folder: /images

collections:
  - name: guides
    label: Guides
    folder: src/content/guides
    create: true
    format: frontmatter
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: slug, label: Slug, widget: string, hint: "URL path without slashes, e.g. portrait-photographer-athens" }
      - { name: title, label: Title, widget: string }
      - { name: metaTitle, label: Meta title, widget: string }
      - { name: metaDescription, label: Meta description, widget: text }
      - { name: h1, label: H1, widget: string }
      - { name: introduction, label: Introduction, widget: text }
      - { name: keyword, label: Keyword, widget: string }
      - name: heroImage
        label: Hero image
        hint: "Main image at the top of the guide."
        widget: object
        required: false
        fields:
          - { name: image, label: Image, widget: image }
          - { name: alt, label: Image description, widget: string }
          - { name: width, label: Width, widget: number, required: false, value_type: int }
          - { name: height, label: Height, widget: number, required: false, value_type: int }
      - name: sections
        label: Page sections
        hint: "Add text sections and image breaks, then drag to reorder them."
        widget: list
        types:
          - name: text
            label: Text section
            widget: object
            summary: "{{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Text, widget: text }
          - name: image
            label: Image between sections
            widget: object
            summary: "{{fields.alt}}"
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Image description, widget: string }
              - { name: caption, label: Caption, widget: string, required: false }
              - { name: width, label: Width, widget: number, required: false, value_type: int }
              - { name: height, label: Height, widget: number, required: false, value_type: int }
      - name: faq
        label: FAQ
        widget: list
        summary: "{{fields.question}}"
        fields:
          - { name: question, label: Question, widget: string }
          - { name: answer, label: Answer, widget: text }
      - name: galleryImages
        label: Additional gallery images
        hint: "Optional extra images shown in the gallery near the bottom of the guide."
        widget: list
        summary: "{{fields.alt}}"
        required: false
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Image description, widget: string }
          - { name: width, label: Width, widget: number, required: false, value_type: int }
          - { name: height, label: Height, widget: number, required: false, value_type: int }
      - { name: relatedPages, label: Related pages, widget: list, required: false, field: { name: slug, label: Slug, widget: string } }
      - { name: schemaType, label: Schema type, widget: select, options: [Photographer, LocalBusiness], default: Photographer }
      - { name: socialImage, label: Social image, widget: image, required: false }
      - { name: ctaText, label: CTA text, widget: text, required: false }
      - { name: draft, label: Draft, widget: boolean, required: false, default: false }
  - name: albums
    label: Albums
    folder: src/content/albums
    create: true
    format: frontmatter
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: slug, label: Slug, widget: string, hint: "URL path without slashes, e.g. the-presence-behind-the-door" }
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: order, label: Order, widget: number, required: false, value_type: int, hint: "Lower numbers appear first." }
      - name: photos
        label: Album photos
        hint: "Add photos from the media library. Drag to change their order."
        widget: list
        summary: "{{fields.image}}"
        fields:
          - { name: image, label: Photo, widget: image }
          - { name: alt, label: Photo description, widget: string, required: false }
      - { name: draft, label: Draft, widget: boolean, required: false, default: false }
