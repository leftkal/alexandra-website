name: Add image copyright metadata

on:
  push:
    branches: [main]
    paths:
      - public/images/cms/**
      - scripts/apply-image-metadata.py
      - scripts/generate-webp.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip image-metadata]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply image copyright metadata
        run: python3 scripts/apply-image-metadata.py
      - name: Generate WebP images
        run: npm run images:webp
      - name: Commit updated image assets
        run: |
          if git diff --quiet -- public/images/cms public/images/generated; then
            echo "No image asset changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cms public/images/generated
          git commit -m "Prepare CMS image assets [skip image-metadata]"
          git push
