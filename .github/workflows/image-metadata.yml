name: Add image copyright metadata

on:
  push:
    branches: [main]
    paths:
      - public/images/cms/**
      - scripts/apply-image-metadata.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip image-metadata]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply image copyright metadata
        run: python3 scripts/apply-image-metadata.py
      - name: Commit updated images
        run: |
          if git diff --quiet -- public/images/cms; then
            echo "No image metadata changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cms
          git commit -m "Add image copyright metadata [skip image-metadata]"
          git push
